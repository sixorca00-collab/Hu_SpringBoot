spring.application.name=huspring

#  Configuración para guardar en un ARCHIVO LOCAL (Persistencia real)
spring.datasource.url=jdbc:h2:file:./datos_proyecto
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#  Activar la consola web
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#  Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
loggin.level.org.hibernate.orm.results.loading = true

#Flyway
spring.flyway.enabled = true