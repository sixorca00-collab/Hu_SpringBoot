spring.application.name=huspring

# 1. Configuración para guardar en un ARCHIVO LOCAL (Persistencia real)
spring.datasource.url=jdbc:h2:file:./datos_proyecto
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Activar la consola web
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 3. Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true