<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Registrar Evento')}"></head>
<body>

<header th:replace="~{fragments :: header}"></header>

<div class="container">
    <div class="form-card">
        <h1 style="font-size: 22px; font-weight: 700; margin-top: 0; margin-bottom: 25px;">📝 Registrar Nuevo Evento</h1>

        <form th:action="@{/admin/events/save}" th:object="${event}" method="POST">

            <div class="form-group">
                <label>Tipo de Evento</label>
                <select th:field="*{type}">
                    <option th:each="typeOpt : ${T(com.hu.huspring.EventType).values()}"
                            th:value="${typeOpt}" th:text="${typeOpt}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Descripción</label>
                <input type="text" th:field="*{desc}" placeholder="Ej. Riwi Talk de Innovación" required />
            </div>

            <div class="form-group">
                <label>Fecha de Inicio</label>
                <input type="datetime-local" th:field="*{startDate}" required />
            </div>

            <div class="form-group">
                <label>Fecha de Fin</label>
                <input type="datetime-local" th:field="*{endDate}" required />
            </div>

            <div class="form-group">
                <label>Sede / Ubicación</label>
                <select name="venue" id="venue">
                    <option value="">-- Seleccionar ubicación (Opcional) --</option>
                    <option th:each="v : ${venues}" th:value="${v.id}" th:text="${v.address}"></option>
                </select>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 30px;">
                <button type="submit" class="btn" style="flex: 1;">💾 Guardar Evento</button>
                <a th:href="@{/admin/events}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
