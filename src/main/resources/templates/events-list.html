<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Catálogo de Eventos')}"></head>
<body>

<header th:replace="~{fragments :: header}"></header>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
        <h1 style="font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -0.5px;">📅 Gestión de Eventos</h1>
        <a th:href="@{/admin/events/new}" class="btn">➕ Registrar Evento</a>
    </div>

    <div th:if="${#lists.isEmpty(events)}" class="alert">
        <strong>Aviso:</strong> Actualmente no hay eventos programados en el sistema.
    </div>

    <table th:unless="${#lists.isEmpty(events)}">
        <thead>
        <tr>
            <th style="width: 80px;">ID</th>
            <th>Tipo de Evento</th>
            <th>Descripción</th>
            <th>Fecha Inicio</th>
            <th>Sede / Lugar</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td th:text="${event.id}"></td>
            <td>
                        <span style="background: #e9ecef; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; color: #495057;"
                              th:text="${event.type}">
                        </span>
            </td>
            <td th:text="${event.desc}"></td>
            <td th:text="${#dates.format(event.startDate, 'dd-MM-yyyy HH:mm')}"></td>
            <td>
                        <span th:text="${event.venue != null ? event.venue.address : 'Sin sede asignada'}"
                              th:style="${event.venue == null ? 'color: var(--text-muted); font-style: italic;' : 'font-weight: 500;'}">
                        </span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
