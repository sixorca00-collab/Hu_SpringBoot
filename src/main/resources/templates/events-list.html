<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Eventos')}"></head>
<body class="admin-shell">

<header th:replace="~{fragments :: header('events')}"></header>

<main class="page-wrap">
    <section class="page-hero">
        <div>
            <p class="eyebrow">Eventos</p>
            <h1>Listado de eventos</h1>
            <p>Consulta, edita y elimina eventos desde esta vista centralizada.</p>
        </div>
        <div class="hero-actions">
            <a th:href="@{/admin}" class="btn btn-secondary">Ir al panel</a>
            <a th:href="@{/admin/events/new}" class="btn">+ Nuevo evento</a>
        </div>
    </section>

    <section class="panel">
        <form class="toolbar" method="get" th:action="@{/admin/events}" style="justify-content: space-between; align-items: end; margin-bottom: 18px;">
            <div class="form-group" style="margin: 0; flex: 1;">
                <label>Categoría</label>
                <input type="text" name="category" th:value="${categoryFilter}" placeholder="Buscar por categoría" />
            </div>
            <div class="form-group" style="margin: 0; flex: 1;">
                <label>Ciudad</label>
                <input type="text" name="city" th:value="${cityFilter}" placeholder="Buscar por ciudad" />
            </div>
            <input type="hidden" name="size" th:value="${pageSize}" />
            <button type="submit" class="btn">Filtrar</button>
            <a th:href="@{/admin/events}" class="btn btn-secondary">Limpiar</a>
        </form>

        <div class="toolbar" style="justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2 class="section-title" style="margin: 0;">Eventos registrados</h2>
            <span class="badge" th:text="${events.content.size()} + ' visibles'">0 visibles</span>
        </div>

        <div th:if="${events.content.isEmpty()}" class="empty-state">
            No hay eventos registrados todavía.
        </div>

        <div th:unless="${events.content.isEmpty()}" style="overflow-x: auto;">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tipo</th>
                    <th>Descripción</th>
                    <th>Inicio</th>
                    <th>Fin</th>
                    <th>Categoría</th>
                    <th>Sede</th>
                    <th>Ciudad</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="event : ${events.content}">
                    <td th:text="${event.id}"></td>
                    <td><span class="badge" th:text="${event.type}"></span></td>
                    <td th:text="${event.desc}"></td>
                    <td th:text="${event.startDate != null ? #dates.format(event.startDate, 'dd/MM/yyyy HH:mm') : 'N/A'}"></td>
                    <td th:text="${event.endDate != null ? #dates.format(event.endDate, 'dd/MM/yyyy HH:mm') : 'N/A'}"></td>
                    <td th:text="${event.categoryName != null ? event.categoryName : 'Sin categoría'}"></td>
                    <td th:text="${event.venueAddress != null ? event.venueAddress : 'Sin sede'}"></td>
                    <td th:text="${event.venueCity != null ? event.venueCity : 'N/A'}"></td>
                    <td>
                        <div class="row-actions">
                            <a th:href="@{/admin/events/edit/{id}(id=${event.id})}" class="btn btn-secondary">Editar</a>
                            <form th:action="@{/admin/events/delete/{id}(id=${event.id})}" method="post">
                                <button type="submit" class="btn btn-danger">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="toolbar" style="justify-content: space-between; align-items: center; margin-top: 18px;">
            <span class="badge" th:text="${'Página ' + (events.number + 1)}">Página 1</span>
            <div class="hero-actions">
                <a th:if="${events.hasPrevious()}"
                   th:href="@{/admin/events(page=${events.number - 1}, size=${pageSize}, category=${categoryFilter}, city=${cityFilter})}"
                   class="btn btn-secondary">Anterior</a>
                <a th:if="${events.hasNext()}"
                   th:href="@{/admin/events(page=${events.number + 1}, size=${pageSize}, category=${categoryFilter}, city=${cityFilter})}"
                   class="btn">Siguiente</a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
