<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Huspring Admin</title>
    <style>
        :root {
            --bg: #eef2f7;
            --surface: #ffffff;
            --surface-strong: #f8fafc;
            --border: #d9e2ec;
            --text: #0f172a;
            --muted: #64748b;
            --primary: #0f172a;
            --primary-soft: #1d4ed8;
            --accent: #0f766e;
            --danger: #b91c1c;
            --shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            --radius: 22px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(29, 78, 216, 0.08), transparent 30%),
                radial-gradient(circle at top right, rgba(15, 118, 110, 0.12), transparent 24%),
                linear-gradient(180deg, #f8fafc 0%, #edf2f7 100%);
            font-family: "Trebuchet MS", "Lucida Sans Unicode", sans-serif;
        }

        a { color: inherit; }

        .admin-shell {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .admin-topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(14px);
            background: rgba(15, 23, 42, 0.92);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .topbar-inner {
            max-width: 1240px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand strong {
            font-size: 18px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .brand span {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav a {
            text-decoration: none;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.04);
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .nav-link:hover,
        .nav-link.is-active {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .page-wrap {
            width: min(1240px, calc(100% - 32px));
            margin: 28px auto 42px;
            flex: 1;
        }

        .page-hero {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 18px;
            margin-bottom: 20px;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .page-hero h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 3vw, 42px);
            line-height: 1.05;
            letter-spacing: -0.04em;
        }

        .page-hero p {
            margin: 0;
            max-width: 70ch;
            color: var(--muted);
        }

        .hero-actions,
        .toolbar,
        .row-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .panel,
        .form-card {
            background: var(--surface);
            border: 1px solid rgba(15, 23, 42, 0.06);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .panel {
            padding: 22px;
        }

        .stats-grid,
        .dashboard-grid {
            display: grid;
            gap: 16px;
        }

        .stats-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
            margin-bottom: 18px;
        }

        .dashboard-grid {
            grid-template-columns: 1.2fr 0.8fr;
        }

        .stat-card {
            padding: 18px;
            border-radius: 18px;
            background: linear-gradient(180deg, #fff, #f8fafc);
            border: 1px solid var(--border);
        }

        .stat-card span {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 10px;
        }

        .stat-card strong {
            display: block;
            font-size: 30px;
            line-height: 1;
            color: var(--text);
        }

        .section-title {
            margin: 0 0 14px;
            font-size: 18px;
            letter-spacing: -0.02em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 18px;
            background: var(--surface);
        }

        thead th {
            background: var(--primary);
            color: #fff;
            padding: 15px 16px;
            text-align: left;
            font-size: 13px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            color: #334155;
            vertical-align: top;
        }

        tbody tr:hover td {
            background: #f8fafc;
        }

        .empty-state,
        .alert {
            padding: 18px;
            border-radius: 18px;
            border: 1px dashed #cbd5e1;
            background: rgba(255, 255, 255, 0.7);
            color: var(--muted);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 16px;
            border: 1px solid transparent;
            border-radius: 14px;
            background: var(--primary-soft);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(29, 78, 216, 0.22);
        }

        .btn-secondary {
            background: #fff;
            color: var(--text);
            border-color: var(--border);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: #f8fafc;
            box-shadow: none;
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            box-shadow: 0 12px 24px rgba(185, 28, 28, 0.22);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: #e2e8f0;
            color: #334155;
        }

        .form-card {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px;
        }

        .form-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            font: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-soft);
            box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.12);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .field-help {
            font-size: 12px;
            color: var(--muted);
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }

        .row-actions form {
            display: inline;
        }

        .footer {
            padding: 24px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 980px) {
            .stats-grid,
            .dashboard-grid,
            .form-grid {
                grid-template-columns: 1fr;
            }

            .page-hero,
            .topbar-inner {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<header th:fragment="header(active)" class="admin-topbar">
    <div class="topbar-inner">
        <div class="brand">
            <strong>Huspring Admin</strong>
            <span>Eventos y sedes desde un solo panel</span>
        </div>
        <nav class="nav">
            <a th:href="@{/admin}" class="nav-link" th:classappend="${active == 'dashboard'} ? ' is-active' : ''">Panel</a>
            <a th:href="@{/admin/events}" class="nav-link" th:classappend="${active == 'events'} ? ' is-active' : ''">Eventos</a>
            <a th:href="@{/admin/venues}" class="nav-link" th:classappend="${active == 'venues'} ? ' is-active' : ''">Sedes</a>
        </nav>
    </div>
</header>

<footer th:fragment="footer" class="footer">
    <div>Panel interno Huspring para administrar eventos y venues.</div>
</footer>

</body>
</html>
