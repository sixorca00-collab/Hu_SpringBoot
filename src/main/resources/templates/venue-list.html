<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sedes')}"></head>
<body class="admin-shell">

<header th:replace="~{fragments :: header('venues')}"></header>

<main class="page-wrap">
    <section class="page-hero">
        <div>
            <p class="eyebrow">Sedes</p>
            <h1>Listado de sedes</h1>
            <p>Gestiona direcciones, capacidad y precios base sin salir del panel.</p>
        </div>
        <div class="hero-actions">
            <a th:href="@{/admin}" class="btn btn-secondary">Ir al panel</a>
            <a th:href="@{/admin/venues/new}" class="btn">+ Nueva sede</a>
        </div>
    </section>

    <section class="panel">
        <div class="toolbar" style="justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2 class="section-title" style="margin: 0;">Sedes registradas</h2>
            <span class="badge" th:text="${#lists.size(venues)} + ' visibles'">0 visibles</span>
        </div>

        <div th:if="${#lists.isEmpty(venues)}" class="empty-state">
            No hay sedes registradas todavía.
        </div>

        <div th:unless="${#lists.isEmpty(venues)}" style="overflow-x: auto;">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Dirección</th>
                    <th>Piso</th>
                    <th>Capacidad</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${venues}">
                    <td th:text="${v.id}"></td>
                    <td th:text="${v.address}"></td>
                    <td th:text="${v.floor}"></td>
                    <td th:text="${v.capacity + ' personas'}"></td>
                    <td th:text="${'$ ' + v.price}"></td>
                    <td>
                        <div class="row-actions">
                            <a th:href="@{/admin/venues/edit/{id}(id=${v.id})}" class="btn btn-secondary">Editar</a>
                            <form th:action="@{/admin/venues/delete/{id}(id=${v.id})}" method="post">
                                <button type="submit" class="btn btn-danger">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
