<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sedes')}"></head>
<body class="admin-shell">

<header th:replace="~{fragments :: header('venues')}"></header>

<main class="page-wrap">
    <section class="page-hero">
        <div>
            <p class="eyebrow">Sedes</p>
            <h1 th:text="${venue.id == null ? 'Crear sede' : 'Editar sede'}">Crear sede</h1>
            <p>Administra direcciones, piso, capacidad y precio base desde el mismo panel.</p>
        </div>
        <div class="hero-actions">
            <a th:href="@{/admin/venues}" class="btn btn-secondary">Volver al listado</a>
        </div>
    </section>

    <section class="form-card">
        <div class="toolbar" style="justify-content: space-between; align-items: center; margin-bottom: 18px;">
            <h2 class="section-title" style="margin: 0;">Detalles de la sede</h2>
            <span class="badge" th:text="${venue.id == null ? 'Nueva' : 'ID #' + venue.id}">Nueva</span>
        </div>

        <form th:action="${venue.id == null} ? @{/admin/venues/save} : @{/admin/venues/update/{id}(id=${venue.id})}"
              th:object="${venue}"
              method="post">

            <div class="form-grid">
                <div class="form-group full">
                    <label>Dirección física</label>
                    <input type="text" th:field="*{address}" placeholder="Ej. Av. El Poblado #10-23" required />
                </div>

                <div class="form-group">
                    <label>Piso / pabellón</label>
                    <input type="number" th:field="*{floor}" min="1" placeholder="Ej. 3" required />
                </div>

                <div class="form-group">
                    <label>Capacidad máxima</label>
                    <input type="number" th:field="*{capacity}" min="1" placeholder="Ej. 150" required />
                </div>

                <div class="form-group full">
                    <label>Precio base de alquiler</label>
                    <input type="number" step="0.01" th:field="*{price}" min="0" placeholder="Ej. 450.00" required />
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Guardar sede</button>
                <a th:href="@{/admin/venues}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
