<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Registrar Nueva Sede')}"></head>
<body>

<header th:replace="~{fragments :: header}"></header>

<div class="container">
    <div class="form-card">
        <h1 style="font-size: 22px; font-weight: 700; margin-top: 0; margin-bottom: 25px;">🏢 Registrar Nueva Sede</h1>

        <form th:action="@{/admin/venues/save}" th:object="${venue}" method="POST">

            <div class="form-group">
                <label>Dirección física</label>
                <input type="text" th:field="*{address}" placeholder="Ej. Av. El Poblado #10-23" required />
            </div>

            <div class="form-group">
                <label>Número de Piso / Pabellón</label>
                <input type="number" th:field="*{floor}" min="1" placeholder="Ej. 3" required />
            </div>

            <div class="form-group">
                <label>Capacidad Máxima de Personas</label>
                <input type="number" th:field="*{capacity}" min="1" placeholder="Ej. 150" required />
            </div>

            <div class="form-group">
                <label>Precio de Alquiler ($)</label>
                <input type="number" step="0.01" th:field="*{price}" min="0" placeholder="Ej. 450.00" required />
            </div>

            <div style="display: flex; gap: 10px; margin-top: 30px;">
                <button type="submit" class="btn" style="flex: 1;">💾 Guardar Lugar</button>
                <a th:href="@{/admin/venues}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
